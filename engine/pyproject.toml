[project]
name = "rcpy"
version = "0.3.0"
description = "Turn dictated recipe audio into structured recipes (JSON, Markdown, HTML)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
# Everything `rcpy serve` needs. Not required for the plain CLI.
api = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[project.scripts]
rcpy = "rcpy.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13", "rcpy[api]"]  # dev installs the API extra too, so plain `uv run` keeps fastapi

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter wraps code; long lines left are prompt text and test data
