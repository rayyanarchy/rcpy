[project]
name = "rcpy"
version = "0.3.0"
description = "Turn dictated recipe audio into structured recipes (JSON, Markdown, HTML)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
rcpy = "rcpy.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
